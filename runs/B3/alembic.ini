[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
path_separator = os
# Overridden at runtime by migrations/env.py from EXIT_DATABASE_URL.
sqlalchemy.url = postgresql+psycopg2:///exit_workflow_b

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
