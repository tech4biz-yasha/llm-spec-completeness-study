[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "exit-workflow"
version = "1.0.0"
description = "Tenant exit workflow module — initiation through completion, deposit settlement and NOC issuance."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.3"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"exit_workflow.spec" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:exit_workflow.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: `Depends(...)` in a default is the FastAPI idiom, not a mutable default.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ISC", "DTZ", "RUF"]
ignore = ["B008", "ISC001"]

[tool.ruff.lint.per-file-ignores]
# conftest sets EXIT_DATABASE_URL before the application modules are imported, which is
# the point of the ordering; and the tests build naive datetimes to prove they are rejected.
"tests/conftest.py" = ["E402"]
"tests/*" = ["DTZ001"]
