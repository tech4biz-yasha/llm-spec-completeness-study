[project]
name = "exit-workflow"
version = "1.0.0"
description = "Tenant exit workflow module (Meridian PropTech) — initiation through NOC issuance."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pyyaml>=6.0",
    "aiokafka>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["exit_workflow*"]

[tool.setuptools.package-data]
"exit_workflow.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:exit_workflow.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
